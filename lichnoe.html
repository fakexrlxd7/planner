    <li><b>Раз в год, полгода и квартал:</b> 1–3 большие цели на каждый горизонт. Разбей каждую на шаги кнопкой «+».</li>
    <li><b>В воскресенье, 10 минут:</b> итоги недели в «Отчёте», цели на неделю в «Целях», встречи и записи в «Календаре».</li>
    <li><b>Каждое утро, 2 минуты:</b> открыть «Сегодня» и отметить флажком до 3 главных дел. Незакрытое со вчера уже перенесено само.</li>
    <li><b>Привычки добавляй один раз</b> (переключатель «↻ Каждый день» или слова «каждый день» в тексте). Дальше они появляются сами, нужно только ставить галочку.</li>
    <li><b>В течение дня:</b> любая мысль сразу в «Сегодня» (на телефоне кнопка «+»). Главное делать фокус-сессиями.</li>
    <li><b>Вечером, 2 минуты:</b> отметить привычки, написать итоги дня и оценить энергию. Квесты дня закроются сами.</li>
  </ol></div>
  <div class="muted" style="font-size:12px;margin-top:6px">Квест-планнер · ${M.title} · версия 5 · ${onFile ? 'открыт как файл с компьютера' : 'открыт по ссылке'}</div>`;
}

/* =====================================================================
   ЭФФЕКТЫ
   ===================================================================== */
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], raf = null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', sizeCv); sizeCv();
function burst(x, y, n){
  if (reduceMotion) return; const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--xp').trim(), cs.getPropertyValue('--xp2').trim(), cs.getPropertyValue('--accent').trim() || '#888', cs.getPropertyValue('--good').trim()];
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4; parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2.5, s: 2.5 + Math.random() * 3, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[i % cols.length], life: 50 + Math.random() * 25}); }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .16; p.vx *= .985; p.r += p.vr; p.life--; cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life / 25)); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore(); });
  parts = parts.filter(p => p.life > 0);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
}
function floatXp(pt, txt){ const el = document.createElement('div'); el.className = 'float'; el.textContent = txt; el.style.left = pt.x + 'px'; el.style.top = (pt.y - 6) + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1200); }
function toast(glyph, kicker, title, sub){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<div class="medal">${esc(glyph)}</div><div><small>${esc(kicker)}</small><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>`;
  const box = $('#toasts'); box.appendChild(el); while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 4500);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
(function boot(){
  const loc = loadLocal();
  if (loc){ S = loc.st; LOG = loc.log; }
  else seed();
  buildSnap();
  if (S.inbox.length){ S.inbox.forEach(i => S.tasks.push(mkTask({title:i.text, horizon:'day', period:todayK(), diff:1}))); S.inbox = []; }
  rollOver(S.demo); autoFreeze(); earnFreeze(); claimDQ(true); checkAch(true);
  saveNow();
  render(); startFocusLoop();
  if (S.focusRun && S.focusRun.paused == null && Date.now() >= S.focusRun.end) finishFocus();
  reminderTick();
  if (syncCfg) setTimeout(syncNow, 300);
  addEventListener('storage', e => {
    if (e.key === M.key && e.newValue){ try { const o = JSON.parse(e.newValue); S = ensure(o.S); LOG = o.LOG || []; buildSnap(); if (!isTyping()){ render(); renderFocus(); } } catch(err){} }
    if (e.key === SYNC_KEY){ try { syncCfg = JSON.parse(e.newValue || 'null'); } catch(err){} render(); }
  });
})();
</script>
