<!DOCTYPE html>
<html lang="ru" data-mode="life">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Личное">
<title>Квест-планнер · Личное</title>
<script>
  (function(){
    try { var t = JSON.parse(localStorage.getItem('qp3-theme') || '"auto"'); if (t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch(e){}
    if (location.protocol.indexOf('http') === 0){
      var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest-lichnoe.webmanifest'; document.head.appendChild(l);
      var i = document.createElement('link'); i.rel = 'apple-touch-icon'; i.href = 'icon-lichnoe-180.png'; document.head.appendChild(i);
      var f = document.createElement('link'); f.rel = 'icon'; f.href = 'icon-lichnoe-192.png'; document.head.appendChild(f);
      if ('serviceWorker' in navigator) addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Спокойный рабочий инструмент: графит/бумага, латунь = опыт и монеты, приглушённый акцент режима. Слева навигация, справа рабочее поле */
  --bg:#f3f1ec;
  --panel:#ffffff;
  --panel2:#f7f5f0;
  --sunk:#ebe8e1;
  --line:#e0dcd3;
  --text:#1f2124;
  --muted:#6d7076;
  --xp:#94733a;
  --xp2:#c9a867;
  --good:#3f8a5a;
  --bad:#b4544f;
  --warn:#b77a35;
  --accent:var(--a-l);
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(30,28,24,.04),0 6px 20px rgba(30,28,24,.05);
  --display:'Commissioner','Segoe UI',system-ui,sans-serif;
  --body:'Golos Text','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-mode=work]{--a-l:#46658c;--a-d:#8ba7c9}
:root[data-mode=life]{--a-l:#5b7a57;--a-d:#9bb596}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0f1012;--panel:#16181b;--panel2:#1b1e22;--sunk:#0b0c0e;--line:#2a2d32;--text:#ebe7df;--muted:#8e9096;--xp:#c8a464;--xp2:#e3c891;--good:#7fb48c;--bad:#d4706c;--warn:#d49a5c;--accent:var(--a-d);--on-accent:#0f1012;--shadow:none;color-scheme:dark}
}
:root[data-theme=dark]{--bg:#0f1012;--panel:#16181b;--panel2:#1b1e22;--sunk:#0b0c0e;--line:#2a2d32;--text:#ebe7df;--muted:#8e9096;--xp:#c8a464;--xp2:#e3c891;--good:#7fb48c;--bad:#d4706c;--warn:#d49a5c;--accent:var(--a-d);--on-accent:#0f1012;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
nav.side{border-right:1px solid var(--line);padding:20px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
.brand{font-family:var(--display);font-weight:700;font-size:15px;padding:2px 10px 16px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;border:2px solid var(--xp);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--xp);flex:none}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:600;text-align:left;width:100%;font-size:14px}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow),inset 3px 0 0 var(--accent)}
.nav-btn .cnt{margin-left:auto;font-size:11px;background:var(--sunk);padding:1px 7px;border-radius:20px;color:var(--text);font-weight:600}
.nav-btn .cnt.hot{background:var(--accent);color:var(--on-accent)}
.navsep{height:1px;background:var(--line);margin:8px 10px}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;display:flex;gap:8px;align-items:flex-start;text-align:left;border-radius:9px;width:100%}
.sync:hover{background:var(--panel2)}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block;flex:none;margin-top:5px}
.sync.ok b{background:var(--good)} .sync.busy b{background:var(--xp);animation:blink 1s infinite} .sync.err b{background:var(--bad)} .sync.off b{background:var(--muted)}
@keyframes blink{50%{opacity:.3}}
.more{display:none}

main{padding:20px clamp(16px,3vw,36px) 120px;max-width:1120px;width:100%;min-width:0}

/* HUD */
.greet{font-size:13px;color:var(--muted);margin:0 0 10px 2px;display:flex;gap:6px 14px;flex-wrap:wrap}
.greet b{color:var(--text);font-weight:600}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.badge{position:relative;width:58px;height:58px}
.badge svg{position:absolute;inset:0;transform:rotate(-90deg)}
.badge .lv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.badge .lv small{display:block;font-family:var(--body);font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;text-align:center}
.hud h2{margin:0;font-size:17px;font-weight:700}
.hud .rank{color:var(--xp)}
.xpbar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;margin:9px 0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),var(--xp2));border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud .sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 11px;font-weight:700;font-size:15px;text-align:left}
.chip svg{width:17px;height:17px;flex:none}
.chip small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.chip.warn{border-color:var(--warn);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 18%,transparent)}}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}
.sidecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
button.sidecard:hover{border-color:var(--c)}
.sidecard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;flex:none}
.sidecard .grow{flex:1;min-width:0}
.sidecard .top{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.sidecard .top div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidecard .top span{color:var(--muted);font-weight:500;font-size:11px;white-space:nowrap}
.mini{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.capture{display:flex;gap:8px;margin-top:8px}
.capture .inp{flex:1}
.banner{margin-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--xp) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--xp) 40%,var(--line));border-radius:12px;padding:10px 14px;font-size:14px}

h1.view{font-size:22px;font-weight:700;margin:24px 0 14px;text-wrap:balance;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1.view small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}

/* horizons */
.horizons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.hz{padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.hz small{font-size:11px;font-weight:500}
.hz:hover{color:var(--text);background:var(--panel2)}
.hz.on{background:var(--text);color:var(--bg)}
.hz.on small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.period{display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.arrow{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.arrow:hover{border-color:var(--text)}
.period .lbl{font-family:var(--display);font-weight:600;font-size:16px;min-width:0}
.pill{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:20px;background:var(--panel)}
.pill:hover{color:var(--text);border-color:var(--text)}
.timebar{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.timebar .mini{flex:1;min-width:110px;margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:50%;display:block}
.fchip:hover{color:var(--text)}
.fchip.on{color:var(--bg);border-color:var(--text);background:var(--text)}

/* forms */
.addq{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:14px;box-shadow:var(--shadow)}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0;width:100%}
.inp:focus{border-color:var(--accent);outline:none;background:var(--panel)}
select.inp{width:auto;padding-right:6px}
textarea.inp{resize:vertical;min-height:80px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f .inp{font-weight:400;font-size:15px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stars{display:flex;align-items:center;gap:1px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 7px}
.star{font-size:16px;color:var(--line);padding:4px 2px;line-height:1}
.star.on{color:var(--xp)}
.btn{background:var(--text);color:var(--bg);font-weight:600;border-radius:9px;padding:9px 15px;white-space:nowrap;font-size:14px}
.btn:hover{opacity:.88}
.btn:disabled{background:var(--sunk);color:var(--muted);opacity:1}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--xp);color:var(--on-accent)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--text);opacity:1}
.btn.red{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 14px 4px;line-height:1.6}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text);background:var(--panel)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}

/* lists & cards */
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec::after{content:"";flex:1;height:1px;background:var(--line);min-width:20px}
.sec.gold{color:var(--xp)}
.list{display:flex;flex-direction:column;gap:8px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 11px 11px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--muted))}
.q.pri{border-color:color-mix(in srgb,var(--xp) 55%,var(--line))}
.q.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,color-mix(in srgb,var(--xp) 7%,transparent),transparent 45%);pointer-events:none}
.q.done{opacity:.6}
.flash{animation:flash 1.6s ease-out;border-radius:10px}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--accent)}}
.row{display:flex;gap:11px;align-items:flex-start;position:relative;z-index:1}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--c,var(--muted));flex:none;display:grid;place-items:center;margin-top:1px;transition:transform .15s;color:var(--panel)}
.chk:hover{transform:scale(1.08)}
.chk svg{width:15px;height:15px;opacity:0}
.done>.row .chk{background:var(--c,var(--good))}
.done>.row .chk svg{opacity:1}
.chk.part{background:linear-gradient(0deg,color-mix(in srgb,var(--c) 45%,transparent) var(--p),transparent var(--p))}
.qmain{flex:1;min-width:0}
.qt{font-weight:600;overflow-wrap:anywhere}
.done>.row .qt{text-decoration:line-through;text-decoration-color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:3px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--text)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.xpv{color:var(--xp);font-weight:700}
.due.late{color:var(--bad);font-weight:600}
.rep{color:var(--accent);font-weight:600}
.pritag{color:var(--xp);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.crumb{font-size:12px;color:var(--muted);margin-bottom:1px}
.pbar{display:flex;align-items:center;gap:10px;margin-top:8px}
.pbar .mini{flex:1;margin:0;height:7px}
.pbar span{font-size:12px;font-weight:700}
.acts{display:flex;gap:1px;flex:none;opacity:.45;transition:opacity .15s;flex-wrap:wrap;justify-content:flex-end}
.q:hover>.row .acts,.node:hover>.row .acts,.acts:focus-within{opacity:1}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--panel2);color:var(--text)}
.ib.on{color:var(--xp);opacity:1}
.ib svg{width:17px;height:17px}
.ib.danger{width:auto;padding:0 10px;color:var(--bad);font-weight:700;font-size:12px;border:1px solid var(--bad)}
.kids{margin:10px 0 0 11px;padding-left:15px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.node{padding:5px 0}
.node .chk{width:21px;height:21px;border-radius:6px}
.node .qt{font-weight:500;font-size:14px}
.node.done>.row .qt{text-decoration:line-through;color:var(--muted)}
.inline{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.inline .inp{flex:1;min-width:150px;padding:7px 10px}
.panelx{margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-family:var(--display);font-weight:600;margin-bottom:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}

/* today */
.dayhead{display:flex;align-items:center;gap:12px;margin:24px 0 14px;flex-wrap:wrap}
.daycard{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px;flex-wrap:wrap}
.dayring{position:relative;width:76px;height:76px;flex:none}
.dayring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dayring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px}
.daytxt{display:flex;flex-direction:column;flex:1;min-width:140px}
.daytxt b{font-family:var(--display);font-size:20px}
.daytxt span{font-size:13px;color:var(--muted)}
.daydq{flex:1;min-width:280px}
.daydq .dq{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.quick{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:12px;box-shadow:var(--shadow);align-items:center}
.quick .inp{padding:10px 12px}
.tchip{font-weight:700;color:var(--text);background:var(--sunk);border-radius:6px;padding:0 6px}
.moved{color:var(--warn);font-weight:600}
.q.hab .chk{border-radius:50%}
.ev.evt{border:1px dashed var(--c);border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.horizons.goalsh{grid-template-columns:repeat(5,1fr)}

.q.hab{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.q.hab:active{transform:scale(.99)}
.q.hab.fut{cursor:default;opacity:.6}
.q.hab .chk{pointer-events:none}
.q.hab.done{opacity:.7}
.q.hab.done .qt{text-decoration:line-through;text-decoration-color:var(--muted)}
.wdots{display:inline-flex;gap:3px;align-items:center}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--sunk);display:block}
.wdots i.on{background:var(--c)}
.wdots i.off{opacity:.35}
.wdots i.cur{outline:1.5px solid var(--text);outline-offset:1px}
details.daydq summary{cursor:pointer;font-size:13px;font-weight:600;margin-bottom:8px;list-style:none}
details.daydq summary::-webkit-details-marker{display:none}
details.daydq summary::before{content:"▸ ";color:var(--muted)}
details.daydq[open] summary::before{content:"▾ "}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28);z-index:66}
.fab svg{width:28px;height:28px}
.ov.sheetov{display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);width:100%;min-width:0;max-width:560px;border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:sup .22s ease-out}
@keyframes sup{from{transform:translateY(40px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheetform{display:flex;flex-direction:column;gap:12px}
.inp.big{font-size:17px;padding:13px 14px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;padding-bottom:2px}
.chiprow .fchip{flex:none;padding:7px 12px;font-size:14px}
.tmini{border:0;background:transparent;color:inherit;font:inherit;width:84px;padding:0}
.seg.wide2{display:grid;grid-template-columns:1fr 1fr}
.seg.wide2 button{padding:9px}
.sheetmsg{font-size:13px;color:var(--good);min-height:16px;font-weight:600}
.undo.ask{max-width:min(560px,calc(100vw - 20px))}
.undo.ask span{font-size:13px}

/* timeline (day) */
.tl{display:flex;flex-direction:column;gap:6px}
.tli{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;width:100%;position:relative;overflow:hidden}
.tli::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.tli .tm{font-weight:700;font-size:13px}
.tli .tt{font-weight:600;font-size:14px}
.tli .tt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tli.now{border-color:var(--accent)}
.tli.past{opacity:.55}

/* daily quests */
.dq{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.dqi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.dqi .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.dqi .t span{color:var(--xp);font-weight:700;white-space:nowrap}
.dqi.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.dqi.ok .t b::before{content:"✓ ";color:var(--good)}
.dqi .mini{margin:0;height:4px}

/* review */
.energy{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.en{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:700;color:var(--muted)}
.en.on{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* habits */
.habit{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.habit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.week7{display:grid;grid-template-columns:repeat(7,32px);gap:4px}
.dcell{height:32px;border-radius:8px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);display:grid;place-items:center;background:var(--panel2)}
.dcell.on{background:var(--c);color:#fff;border-color:transparent}
.dcell.off{opacity:.35;border-style:dashed}
.dcell.today{outline:2px solid var(--text);outline-offset:1px}
.dcell:disabled{opacity:.25}
.streak{font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;color:var(--xp);min-width:48px;justify-content:flex-end}
.streak svg{width:15px;height:15px}
.todayhab{display:flex;gap:6px;flex-wrap:wrap}
.hpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:5px 12px 5px 5px;font-weight:600;font-size:13px}
.hpill b{width:21px;height:21px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff}
.hpill.on b{background:var(--c)}
.hpill.on{color:var(--muted)}
.hpill b svg{width:11px;height:11px;opacity:0}
.hpill.on b svg{opacity:1}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dow{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);background:var(--panel2)}
.dow.on{background:var(--text);color:var(--bg);border-color:transparent}

/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar .lbl{font-family:var(--display);font-weight:600;font-size:16px}
.wk{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:auto;box-shadow:var(--shadow)}
.wkin{min-width:720px}
.wkhead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.wkhead div{padding:8px 6px;font-size:12px;color:var(--muted);font-weight:600;text-align:center;border-left:1px solid var(--line)}
.wkhead div:first-child{border-left:0}
.wkhead b{display:block;font-family:var(--display);font-size:17px;color:var(--text)}
.wkhead .td b{color:var(--on-accent);background:var(--accent);border-radius:8px;display:inline-block;padding:0 7px}
.allday{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.allday>div{border-left:1px solid var(--line);padding:4px;min-width:0;display:flex;flex-direction:column;gap:3px;min-height:26px}
.allday>div:first-child{border-left:0;font-size:10px;color:var(--muted);align-items:center;justify-content:center}
.adc{max-width:100%;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--text);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c)}
.wkbody{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));position:relative}
.hours div{height:var(--hh);font-size:10px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px)}
.calcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh));cursor:copy}
.calcol.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-left:3px solid var(--c);color:var(--text);text-align:left;cursor:pointer;z-index:2}
.ev b{display:block;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.shiftbg{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--c) 9%,transparent);border-left:3px solid var(--c);pointer-events:none;z-index:1}
.shiftbg button{pointer-events:auto;position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 5px;max-width:calc(100% - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shiftbg button:hover{color:var(--text);border-color:var(--c)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.mon{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.mon .h{padding:7px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.mc{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;min-width:0}
.mc:nth-child(7n+1){border-left:0}
.mc.out{background:var(--panel2);color:var(--muted)}
.mc .d{font-size:12px;font-weight:700;margin-bottom:2px}
.mc.today .d{color:var(--on-accent);background:var(--accent);border-radius:6px;padding:0 6px;align-self:flex-start}
.mc .e{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.mc .e i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.mc .more{font-size:11px;color:var(--muted);display:block}
.agday{margin-bottom:12px}
.agday h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.agday.today h4{color:var(--accent)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:80;display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal form{display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.sres{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:60vh;overflow:auto}
.sr{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;text-align:left;width:100%}
.sr:hover,.sr:focus-visible{background:var(--panel2)}
.sr i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sr small{display:block;color:var(--muted);font-size:12px}

/* wishes / shop / money */
.wishgrid,.shop,.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wish,.rw{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.wish .top,.rw .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wish .top b,.rw .top b{overflow-wrap:anywhere}
.price{color:var(--xp);font-weight:700;white-space:nowrap}
.wish .mini,.rw .mini{margin:0}
.cool{font-size:12px;color:var(--warn);font-weight:600}
.prio{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.wallet{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid color-mix(in srgb,var(--xp) 45%,var(--line));border-radius:14px;padding:14px 18px;margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.coin{width:44px;height:44px;border-radius:50%;border:3px solid var(--xp);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--xp);flex:none;font-size:18px}
.wallet b{font-family:var(--display);font-size:24px;display:block}
.wallet small{color:var(--muted);font-size:12px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;font-family:var(--display);flex:none;border:2px dashed var(--line);color:var(--muted)}
.ach.got .medal{border:3px solid var(--xp);color:var(--xp);background:color-mix(in srgb,var(--xp) 10%,var(--panel))}
.ach b{display:block;font-size:14px}
.ach small{color:var(--muted);font-size:12px;display:block}
.ach:not(.got) b{color:var(--muted)}
.ach .pr{font-size:11px;color:var(--muted);margin-top:3px}
.achhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.achhead .mini{flex:1;height:8px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow)}
.tile small{color:var(--muted);font-size:12px;font-weight:600;display:block}
.tile b{font-family:var(--display);font-size:21px;font-weight:700;display:block;margin-top:3px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.heat{overflow-x:auto}
.heat svg{display:block;min-width:560px;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.hzrow{display:grid;grid-template-columns:90px 1fr 60px;gap:12px;align-items:center;padding:5px 0;font-size:14px}
.hzrow .mini{margin:0;height:7px}
.goalbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goalbig b{font-family:var(--display);font-size:28px}
.bigbar{height:12px;border-radius:12px;background:var(--sunk);overflow:hidden;margin:10px 0 6px}
.bigbar i{display:block;height:100%;background:var(--good);border-radius:12px;transition:width .6s}
.sp{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:0}
.sp .dot{width:14px;height:14px;border-radius:5px;background:var(--c);flex:none}
.sp .grow{flex:1;min-width:0}
.sp .grow b{display:block;font-size:14px}
.sp .grow small{color:var(--muted);font-size:12px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.csw{width:26px;height:26px;border-radius:8px;border:2px solid transparent}
.csw.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--panel)}
details.guide{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2)}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ol{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunk);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;user-select:all}

/* focus widget */
.focus{position:fixed;left:256px;bottom:18px;z-index:65;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.22);max-width:min(460px,calc(100vw - 32px))}
.focus .ring{position:relative;width:48px;height:48px;flex:none}
.focus .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.focus .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent)}
.focus .tm{font-family:var(--display);font-size:20px;font-weight:700}
.focus .nm{font-size:12px;color:var(--muted);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus .btnrow{flex-wrap:nowrap;gap:6px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;z-index:60;pointer-events:none;font-family:var(--display);font-weight:700;color:var(--xp);font-size:14px;animation:up 1.1s ease-out forwards}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-54px);opacity:0}}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 34px rgba(0,0,0,.2);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast .medal{width:38px;height:38px;border:3px solid var(--xp);color:var(--xp);font-size:13px}
.toast small{display:block;color:var(--xp);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.toast b{display:block;font-size:14px}
.toast span{font-size:12px;color:var(--muted)}
.undo{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:85;background:var(--text);color:var(--bg);border-radius:12px;padding:9px 10px 9px 16px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 12px 34px rgba(0,0,0,.25);animation:tin .25s}
.undo button{color:var(--xp2);font-weight:700;padding:4px 8px;border-radius:7px}
.undo button:hover{background:rgba(255,255,255,.08)}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{opacity:1}}
.undo{animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:5px 5px calc(5px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:70;overflow:visible;background:var(--panel)}
  .brand,.sync,.navsep,nav.side .desk{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;align-items:center;text-align:center;flex:1;min-width:0;position:relative}
  .nav-btn .cnt{position:absolute;top:0;right:calc(50% - 22px);margin:0;padding:0 5px;font-size:10px}
  .nav-btn.on{box-shadow:inset 0 -2px 0 var(--accent);background:transparent}
  .more{display:flex}
  .moresheet{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px;box-shadow:0 12px 34px rgba(0,0,0,.25);z-index:75}
  .moresheet .nav-btn{flex-direction:row;font-size:14px;padding:10px;justify-content:flex-start}
  .moresheet .nav-btn .cnt{position:static;margin-left:auto}
  .moresheet .sync{display:flex;grid-column:1/-1}
  main{padding-top:calc(14px + env(safe-area-inset-top))}
  .hud{grid-template-columns:auto 1fr;gap:12px;padding:12px 14px}
  .chips{grid-column:1/-1;justify-content:flex-start}
  .tiles{grid-template-columns:1fr 1fr}
  .sides{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .sides .sidecard{min-width:170px;flex:1 0 170px}
  .toast:nth-last-child(n+3){display:none}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom));right:10px;left:10px;max-width:none}
  .focus{left:10px;bottom:calc(72px + env(safe-area-inset-bottom))}
  .undo{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (max-width:900px){
  .inp,select.inp,textarea.inp,input,select,textarea{font-size:16px}
  .deskonly,.quick{display:none}
  .q{padding:12px 10px 12px 13px}
  .chk{width:28px;height:28px;border-radius:8px}
  .chk svg{width:17px;height:17px}
  .node .chk{width:24px;height:24px}
  .qt{font-size:16px}
  .acts .ib{display:none}
  .acts .ib.keep{display:grid;width:38px;height:38px}
  .acts{opacity:1}
  .hud .sub{display:none}
  .greet{display:none}
  .badge{width:46px;height:46px}
  .badge svg{width:46px;height:46px}
  .badge .lv{font-size:16px}
  .badge .lv small{display:none}
  .hud h2{font-size:15px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{padding:6px 10px;font-size:14px;flex:none}
  .dayhead{position:sticky;top:0;z-index:20;background:var(--bg);margin:12px -16px 10px;padding:8px 16px;border-bottom:1px solid var(--line)}
  .dayhead h1.view{font-size:20px}
  .toasts{top:calc(8px + env(safe-area-inset-top));bottom:auto}
  .toast:nth-last-child(n+2){display:none}
  main{padding-bottom:150px}
  .panelx .btn.sm{padding:8px 12px;font-size:14px}
}
@media (max-width:600px){
  .horizons{grid-template-columns:repeat(3,1fr)}
  .addq{grid-template-columns:1fr 1fr!important}
  .addq>.wide{grid-column:1/-1}
  .habit{grid-template-columns:1fr auto}
  .habit .week7{grid-column:1/-1;grid-template-columns:repeat(7,1fr)}
  .acts{opacity:1}
  .grid3{grid-template-columns:1fr 1fr}
  .quick{grid-template-columns:1fr auto}
  .quick .seg{grid-column:1/-1;justify-self:start}
  .quick #qIn{grid-column:1/-1}
  .horizons.goalsh{grid-template-columns:repeat(3,1fr)}
  .daycard{padding:12px}
  .daydq{min-width:100%}
  .daydq .dq{display:flex;overflow-x:auto;scrollbar-width:none}
  .daydq .dqi{min-width:132px;flex:none}
  .dayring{width:60px;height:60px}
  .dayring svg{width:60px;height:60px}
  .dayring b{font-size:15px}

function occurs(ev, k){
  if (ev.skip && ev.skip[k]) return false;

  const r = ev.repeat || 'none'; if (r === 'none') return k === ev.date;
  const d = parseDk(k), d0 = parseDk(ev.date); const diff = Math.round((d - d0) / 864e5);
  switch(r){
    case 'day': return true;
    case 'weekday': return dow(d) < 5;
    case 'week': return diff % 7 === 0;
    case 'week2': return diff % 14 === 0;
    case 'week4': return diff % 28 === 0;
    case 'month': { const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return d.getDate() === Math.min(d0.getDate(), last); }

  }

}

let snap = new Map(), saveTimer = null, storageOk = true;
const jsNoU = o => JSON.stringify(o, (k, v) => k === 'u' ? undefined : v);
function buildSnap(){
  snap = new Map();
  COLS.forEach(c => S[c].forEach(it => snap.set(c + '|' + it.id, jsNoU(it))));
  LOG.forEach(l => snap.set('log|' + l.id, '1'));
  snap.set('settings', jsNoU(S.settings));
}
function stamp(){
  const now = Date.now(); const seen = new Set();
  COLS.forEach(c => S[c].forEach(it => {
    const key = c + '|' + it.id; const j = jsNoU(it); seen.add(key);
    if (snap.get(key) !== j){ it.u = now; snap.set(key, j); delete S.del[it.id]; }
  }));
  LOG.forEach(l => { const key = 'log|' + l.id; seen.add(key); if (!snap.has(key)){ snap.set(key, '1'); delete S.del[l.id]; } });
  const sj = jsNoU(S.settings); if (snap.get('settings') !== sj){ S.settings.u = now; snap.set('settings', sj); }
  seen.add('settings');
  for (const key of [...snap.keys()]) if (!seen.has(key)){ const id = key.slice(key.indexOf('|') + 1); S.del[id] = now; snap.delete(key); }
}
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }
function saveNow(){
  clearTimeout(saveTimer);
  stamp();
  const cut = Date.now() - 1200 * 864e5; LOG = LOG.filter(l => l.t >= cut);
  const dcut = Date.now() - 200 * 864e5; for (const k in S.del) if (S.del[k] < dcut) delete S.del[k];
  try { localStorage.setItem(M.key, JSON.stringify({S, LOG})); storageOk = true; } catch(e){ storageOk = false; }
  scheduleSync();
}

function loadLocal(){
  try {
    const r = localStorage.getItem(M.key); if (r){ const o = JSON.parse(r); if (o && o.S) return {st: ensure(o.S), log: o.LOG || []}; }
    const r2 = localStorage.getItem(M.v2key); if (r2){ const o = JSON.parse(r2); if (o && o.S) return migrateV2(o); }
  } catch(e){ storageOk = false; }
  return null;
}
function mergeInto(R){
  const L = S; const del = {...(L.del || {})};
  for (const [k, v] of Object.entries(R.S.del || {})) if (!del[k] || del[k] < v) del[k] = v;
  const out = {...L, del};
  COLS.forEach(c => {
    const m = new Map(); (L[c] || []).forEach(x => m.set(x.id, x));
    (R.S[c] || []).forEach(x => { const a = m.get(x.id); if (!a || (x.u || 0) > (a.u || 0)) m.set(x.id, x); });
    out[c] = [...m.values()].filter(x => !(del[x.id] && del[x.id] >= (x.u || 0)));
  });
  const lm = new Map(); LOG.forEach(l => lm.set(l.id, l)); (R.LOG || []).forEach(l => { if (!lm.has(l.id)) lm.set(l.id, l); });
  const newLog = [...lm.values()].filter(l => !(del[l.id] && del[l.id] >= (l.c || l.t))).sort((a, b) => a.t - b.t);
  ['reviews','weekReviews'].forEach(k => { const o = {...(L[k] || {})}; for (const [d, v] of Object.entries(R.S[k] || {})) if (!o[d] || (v.t || 0) > (o[d].t || 0)) o[d] = v; out[k] = o; });
  const ach = {...(L.ach || {})}; for (const [k, v] of Object.entries(R.S.ach || {})) if (!ach[k] || v < ach[k]) ach[k] = v; out.ach = ach;
  out.settings = ((R.S.settings && R.S.settings.u || 0) > (L.settings.u || 0)) ? {...R.S.settings, lastBackup: L.settings.lastBackup} : L.settings;
  out.demo = !!(L.demo && R.S.demo);

  S = ensure(out); LOG = newLog;
}
function stable(o){

  return JSON.stringify(o);
}
function syncable(st, log){

  COLS.forEach(c => { o[c] = (st[c] || []).slice().sort((a, b) => a.id < b.id ? -1 : 1); });
  return {S: o, LOG: (log || []).slice().sort((a, b) => a.id < b.id ? -1 : 1)};
}

/* =====================================================================
   СИНХРОНИЗАЦИЯ ЧЕРЕЗ GITHUB GIST (с шифрованием AES-GCM)
   ===================================================================== */
const SYNC_KEY = 'qp3-sync';
let syncCfg = null, syncSt = {s:'off', msg:'', at:0}, syncing = false, syncAgain = false, syncTimer = null, syncFirst = false;
try { syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch(e){}
const GH = 'https://api.github.com';
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const keyCache = new Map();
async function deriveKey(pass, salt){
  const ck = pass + '|' + b64(salt); if (keyCache.has(ck)) return keyCache.get(ck);
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  keyCache.set(ck, k); return k;
}
async function gz(u8){ if (!window.CompressionStream) return null; const s = new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function ungz(u8){ const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
let packSalt = null;
async function pack(obj){
  let data = te.encode(JSON.stringify(obj)); let z = 0;
  const c = await gz(data); if (c){ data = c; z = 1; }
  if (!packSalt) packSalt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(syncCfg.pass, packSalt);
  const enc = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data));
  return JSON.stringify({app:'quest-planner', enc:1, z, salt:b64(packSalt), iv:b64(iv), data:b64(enc), at:new Date().toISOString()});
}
async function unpack(raw){
  const env = JSON.parse(raw);
  if (env.app !== 'quest-planner' || !env.enc) throw new Error('format');
  const salt = unb64(env.salt); const key = await deriveKey(syncCfg.pass, salt);
  let data = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(env.iv)}, key, unb64(env.data)));
  if (env.z) data = await ungz(data);
  packSalt = salt;
  return JSON.parse(td.decode(data));
}
async function gh(path, opt = {}){
  const r = await fetch(GH + path, {...opt, cache:'no-store', headers:{'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + syncCfg.token, ...(opt.body ? {'Content-Type':'application/json'} : {})}});
  if (!r.ok){ const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function pullRemote(){
  const g = await gh('/gists/' + syncCfg.gist + '?t=' + Date.now());
  const f = g.files && g.files[M.file]; if (!f) return null;

async function pushRemote(){

}
function setSync(s, msg){ syncSt = {s, msg: msg || '', at: s === 'ok' ? Date.now() : syncSt.at}; const el = $('#sync'); if (el) el.outerHTML = syncHtml(); const el2 = $('#syncState'); if (el2) el2.innerHTML = syncStateText(); }
function syncStateText(){
  if (!syncCfg) return 'Не настроена. Данные только на этом устройстве';

  return {ok:'Синхронизировано ' + tt, busy:'Синхронизирую…', err:syncSt.msg || 'Ошибка синхронизации', off:'Нет сети, изменения сохранены и уйдут позже', idle:'Подключено'}[syncSt.s] || 'Подключено';
}
function syncHtml(){

  return `<button class="sync ${cls}" id="sync" data-a="nav" data-id="settings"><b></b><span>${storageOk ? esc(syncStateText()) : 'Браузер не даёт сохранять данные: сделай резервную копию'}</span></button>`;
}
function scheduleSync(){ if (!syncCfg) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2500); }
async function syncNow(){

  if (!navigator.onLine){ setSync('off'); return; }
  syncing = true; setSync('busy');
  try {
    clearTimeout(saveTimer); stamp();
    const raw = await pullRemote();
    let remote = null;
    if (raw){ try { remote = await unpack(raw); } catch(e){ setSync('err', 'Неверный пароль шифрования. Проверь его в настройках'); syncing = false; return; } }
    if (remote && remote.S){
      if (syncFirst && S.demo){ S = ensure(remote.S); S.focusRun = null; LOG = remote.LOG || []; }
      else if (syncFirst && remote.S.demo && !S.demo){ /* на сервере только пример — перезапишем своими данными */ }
      else mergeInto(remote);

      try { localStorage.setItem(M.key, JSON.stringify({S, LOG})); } catch(e){}

    }

  } catch(e){

let focusInt = null;
function focusLeft(){ const r = S.focusRun; if (!r) return 0; return r.paused != null ? r.paused : Math.max(0, r.end - Date.now()); }
function startFocus(taskId){
  if (S.focusRun){ toast('◷', 'Фокус уже идёт', 'Сначала закончи текущую сессию', 'или нажми «Стоп»'); return; }
  const len = S.settings.focusLen || 25;
  S.focusRun = {taskId: taskId || null, len, end: Date.now() + len * 60e3, paused: null};
  persist(); startFocusLoop(); askNotify();
}
function startFocusLoop(){ clearInterval(focusInt); if (S.focusRun) focusInt = setInterval(focusTick, 1000); renderFocus(); }
function focusTick(){ const r = S.focusRun; if (!r){ clearInterval(focusInt); return; } if (r.paused == null && Date.now() >= r.end){ finishFocus(); return; } updateFocusWidget(); }
function finishFocus(){
  const r = S.focusRun; if (!r) return; clearInterval(focusInt);
  const t = r.taskId && getT(r.taskId); const xp = Math.round(r.len * 0.6);
  addLog({id:'f:' + uid(), xp, sp: t ? t.spaceId : null, f: r.len, task: t ? t.title : ''});
  S.focusRun = null; beep();
  notify('Фокус-сессия завершена', (t ? t.title + ' · ' : '') + '+' + xp + ' XP. Перерыв 5 минут.');
  document.title = '⏰ Фокус завершён'; setTimeout(() => document.title = TITLE, 6000);
  toast('◷', 'Фокус завершён', r.len + ' минут в потоке', '+' + xp + ' XP · отдохни 5 минут');
  commit(null, {x: innerWidth / 2, y: innerHeight - 120});
}

function reminderTick(){
  const now = Date.now(); const T = todayK(); let changed = false;
  [T, addDays(T, 1)].forEach(k => eventsOn(k).forEach(e => {
    if (!e.remind) return;
    const base = parseDk(k).getTime() + (e.start ? tmin(e.start) * 60e3 : 9 * 3600e3);
    const fireAt = base - e.remind * 60e3; const key = e.id + '@' + k;

      notify(e.title, when + (e.place ? ' · ' + e.place : ''));

    if (t.done || !t.time) return; const k = t.due || (t.horizon === 'day' ? t.period : null); if (k !== T) return;
    const base = parseDk(k).getTime() + tmin(t.time) * 60e3; const key = t.id + '@' + k + t.time;

  });

}

function parseQuick(txt){
  let s = ' ' + txt.trim() + ' '; let day = dk(ui.day), time = null;
  const dm = [[/\sпослезавтра\s/i, 2], [/\sзавтра\s/i, 1], [/\sсегодня\s/i, 0]];
  for (const [re, n] of dm){ if (re.test(s)){ day = addDays(todayK(), n); s = s.replace(re, ' '); break; } }
  const m = s.match(/\s(?:в\s)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s)/);
  if (m){ time = pad(+m[1]) + ':' + m[2]; s = s.replace(m[0], ' '); }

function layoutDay(items){
  const ev = items.filter(e => e.start).map(e => ({e, s: tmin(e.start), en: Math.max(tmin(e.end) ?? tmin(e.start) + 30, tmin(e.start) + 20)})).sort((a, b) => a.s - b.s || b.en - a.en);
  let cluster = [], clEnd = -1; const out = [];
  const flush = () => { const lanes = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.lanes = lanes; out.push(x); }); cluster = []; };
  const laneEnds = [];
  ev.forEach(x => {
    if (x.s >= clEnd && cluster.length){ flush(); laneEnds.length = 0; }
    let lane = laneEnds.findIndex(end => end <= x.s); if (lane < 0){ lane = laneEnds.length; laneEnds.push(x.en); } else laneEnds[lane] = x.en;
    x.lane = lane; cluster.push(x); clEnd = Math.max(clEnd, x.en);
  });
  if (cluster.length) flush();
  return out;
}

        <div class="chiprow taskonly" style="${ui.addHabit ? 'display:none' : ''}"><button type="button" class="fchip ${!ui.qday ? 'on' : ''}" data-a="qday" data-id="today">Сегодня</button><button type="button" class="fchip ${ui.qday === 'tom' ? 'on' : ''}" data-a="qday" data-id="tom">Завтра</button><label class="fchip" style="gap:6px">Время<input type="time" name="tm" class="tmini"></label></div>
        <div class="sheetmsg">${esc(ui.sheetMsg || '')}</div>

      </form></div></div>`;

  else if (m.kind === 'search') box.innerHTML = `<div class="ov" data-a="mclose" style="place-items:start center;padding-top:10vh"><div class="modal" data-a="noop"><h3>Поиск<button class="ib" data-a="mclose" aria-label="Закрыть">✕</button></h3><input class="inp" id="sq" placeholder="Что ищем?" value="${esc(ui.sq || '')}" autocomplete="off"><div class="sres" id="sres">${searchResults(ui.sq)}</div></div></div>`;
}

/* ---------- Привычки ---------- */
function schedLabel(s){ if (!s) return 'каждый день'; const k = s.join(''); if (k === '01234') return 'по будням'; if (k === '56') return 'по выходным'; return s.map(i => WS[i]).join(', '); }
function habitsHtml(){
  const ws = wkStart(new Date()); const days = [...Array(7)].map((_, i) => { const d = new Date(ws); d.setDate(d.getDate() + i); return d; });
  const tk = todayK(); const list = S.habits.filter(passFilter);
  return `<h1 class="view">Привычки <small>то, из чего складывается дисциплина</small></h1>
  <form class="addq habform" data-f="habit" style="grid-template-columns:1fr auto auto">
    <input type="text" class="inp wide" id="habTitle" name="t" placeholder="Новая привычка: например, «${IS_WORK ? 'Inbox zero к 18:00' : '10 000 шагов'}»" maxlength="100" autocomplete="off">
    <select class="inp" name="sp" aria-label="Сфера">${spaceOptions(S.spaces.some(s => s.id === ui.habSpace) ? ui.habSpace : S.spaces[0].id)}</select>
    <button class="btn acc wide">Добавить</button>
    <div class="btnrow wide" style="grid-column:1/-1"><span class="muted" style="font-size:12px">Дни:</span><div class="dows">${WS.map((w, i) => `<button type="button" class="dow ${ui.habSched.includes(i) ? 'on' : ''}" data-a="habdow" data-id="${i}">${w}</button>`).join('')}</div>
      <button type="button" class="pill" data-a="habpreset" data-id="all">Каждый день</button><button type="button" class="pill" data-a="habpreset" data-id="wd">Будни</button><button type="button" class="pill" data-a="habpreset" data-id="we">Выходные</button></div>
  </form>
  <div class="hint">Отметка даёт 5 XP. Серия считается только по дням, на которые привычка запланирована. Если отметить все запланированные за день, засчитывается квест дня.</div>
  ${filterChips()}
  <div class="list">${list.length ? list.map(h => { const sp = spaceOf(h.spaceId); const st = habitStreak(h); const cnt = Object.keys(h.days).length;
    const last30 = [...Array(30)].map((_, i) => shiftD('day', new Date(), -i)).filter(d => habitOn(h, d)); const rate = last30.length ? Math.round(last30.filter(d => h.days[dk(d)]).length / last30.length * 100) : 0;
    return `<div class="habit" style="--c:${sp.color}">
      <div>${ui.editing === h.id ? `<form class="inline" data-f="habren" data-id="${h.id}" style="margin:0 0 6px"><input class="inp" id="ed-${h.id}" name="t" value="${esc(h.title)}" maxlength="100"><button class="btn sm acc">OK</button></form>` : `<b>${esc(h.title)}</b> <button class="ib" data-a="habedit" data-id="${h.id}" aria-label="Переименовать" style="width:24px;height:24px;display:inline-grid;vertical-align:middle">${IC.edit}</button>`}<div class="meta"><span class="tag" style="--c:${sp.color}"><i></i>${esc(sp.name)}</span><span>${schedLabel(h.sched)}</span><span class="num">${rate}% за 30 дней</span><span class="num">${cnt} ${plural(cnt,'отметка','отметки','отметок')}</span>
      ${ui.del === h.id ? `<button class="ib danger" data-a="delhabit" data-id="${h.id}">Удалить с историей?</button>` : `<button class="ib" data-a="delhabit" data-id="${h.id}" aria-label="Удалить привычку" style="width:24px;height:24px">${IC.trash}</button>`}</div></div>
      <div class="week7">${days.map((d, i) => { const k = dk(d); return `<button class="dcell ${h.days[k] ? 'on' : ''} ${k === tk ? 'today' : ''} ${habitOn(h, d) ? '' : 'off'}" data-a="habit" data-id="${h.id}" data-d="${k}" ${k > tk ? 'disabled' : ''} aria-label="${WS[i]} ${d.getDate()}">${WS[i]}</button>`; }).join('')}</div>
      <div class="streak" title="Серия">${IC.fire}<span class="num">${st}</span></div>
    </div>`; }).join('') : `<div class="empty"><b>Нет привычек</b>Добавь то, что хочешь делать регулярно.</div>`}</div>`;
}

/* ---------- Хотелки ---------- */
function wishesHtml(){
  const want = S.wishes.filter(w => w.status !== 'bought').sort((a, b) => a.prio - b.prio || b.created - a.created);
  const got = S.wishes.filter(w => w.status === 'bought').sort((a, b) => (b.boughtAt || 0) - (a.boughtAt || 0));
  const total = want.reduce((a, w) => a + (w.price || 0), 0), saved = want.reduce((a, w) => a + (w.saved || 0), 0);
  const PR = {1:['Очень хочу','var(--bad)'], 2:['Хочу','var(--xp)'], 3:['Когда-нибудь','var(--muted)']};
  const card = w => {
    const p = w.price ? Math.min(1, (w.saved || 0) / w.price) : 0; const coolLeft = 72 - (Date.now() - w.created) / 3600e3; const act = ui.wishAct && ui.wishAct.id === w.id ? ui.wishAct.k : null;
    const goal = w.goalId && getT(w.goalId); const rw = w.rewardId && S.rewards.find(r => r.id === w.rewardId);
    return `<div class="wish"><div class="top"><div><span class="prio" style="color:${PR[w.prio][1]}">${PR[w.prio][0]}</span><br><b>${esc(w.title)}</b></div><span class="price num">${w.price ? eur(w.price) : 'цена?'}</span></div>
      ${w.price ? `<div><div class="mini"><i style="width:${p * 100}%;background:var(--good)"></i></div><div class="meta num"><span>собрано ${eur(w.saved || 0)} · ${Math.round(p * 100)}%</span>${p < 1 ? `<span>осталось ${eur(w.price - (w.saved || 0))}</span>` : '<span style="color:var(--good);font-weight:600">деньги собраны</span>'}</div></div>` : ''}
      ${coolLeft > 0 ? `<div class="cool">Остывает ещё ${Math.ceil(coolLeft)} ч. Правило 72 часов: если через 3 дня всё ещё хочется, покупка осознанная</div>` : ''}
      ${w.url ? `<a href="${esc(w.url)}" target="_blank" rel="noopener" style="font-size:13px;overflow-wrap:anywhere">${esc(w.url.replace(/^https?:\/\//, '').slice(0, 50))}</a>` : ''}
      ${w.note ? `<div class="note">${esc(w.note)}</div>` : ''}
      ${goal ? `<div class="meta"><span>⚑ цель: ${esc(goal.title)} · ${Math.round(progress(goal) * 100)}%</span></div>` : ''}${rw ? `<div class="meta"><span>♥ в наградах за ${rw.cost} монет</span></div>` : ''}
      ${act === 'dep' ? `<form class="inline" data-f="wishdep" data-id="${w.id}" style="margin:0"><input class="inp" id="wa-${w.id}" name="a" type="number" min="0.01" step="0.01" placeholder="Сумма, €"><button class="btn sm acc">Отложить</button></form>` : ''}
      ${act === 'rw' ? `<form class="inline" data-f="wishrw" data-id="${w.id}" style="margin:0"><input class="inp" id="wa-${w.id}" name="c" type="number" min="1" step="10" value="${Math.max(100, Math.round((w.price || 50) * 2 / 10) * 10)}" placeholder="Цена в монетах"><button class="btn sm acc">В награды</button></form>` : ''}
      ${act === 'edit' ? `<form data-f="wishedit" data-id="${w.id}" style="display:flex;flex-direction:column;gap:8px"><input class="inp" id="wa-${w.id}" name="t" value="${esc(w.title)}"><div class="grid2"><input class="inp" name="p" type="number" min="0" step="1" value="${w.price || ''}" placeholder="Цена, €"><select class="inp" name="pr" style="width:100%">${[1,2,3].map(i => `<option value="${i}" ${w.prio === i ? 'selected' : ''}>${PR[i][0]}</option>`).join('')}</select></div><input class="inp" name="url" value="${esc(w.url || '')}" placeholder="Ссылка"><input class="inp" name="n" value="${esc(w.note || '')}" placeholder="Заметка: размер, цвет, модель"><div class="btnrow"><button class="btn sm acc">Сохранить</button><button type="button" class="btn sm ghost" data-a="cancel">Отмена</button></div></form>` : ''}
      <div class="btnrow" style="margin-top:auto">
        <button class="btn sm ghost" data-a="wishact" data-id="${w.id}" data-k="dep">+ Отложить</button>
        <button class="btn sm ${p >= 1 ? 'acc' : 'ghost'}" data-a="wishbuy" data-id="${w.id}">Купил</button>
        ${!goal ? `<button class="btn sm ghost" data-a="wishgoal" data-id="${w.id}" title="Сделать целью в квестах">В цели</button>` : ''}
        <span style="flex:1"></span><button class="ib" data-a="wishact" data-id="${w.id}" data-k="edit" aria-label="Изменить">${IC.edit}</button>
        ${ui.del === w.id ? `<button class="ib danger" data-a="wishdel" data-id="${w.id}">Удалить?</button>` : `<button class="ib" data-a="wishdel" data-id="${w.id}" aria-label="Удалить">${IC.trash}</button>`}
      </div></div>`;
  };
  return `<h1 class="view">Хотелки <small>${want.length} ${plural(want.length,'желание','желания','желаний')} на ${eur(total)} · собрано ${eur(saved)}</small></h1>
  <form class="addq" data-f="wish" style="grid-template-columns:1fr 130px 150px auto">
    <input type="text" class="inp wide" id="wishTitle" name="t" placeholder="Чего хочется: вещь, поездка, курс…" maxlength="100" autocomplete="off">
    <input class="inp" name="p" type="number" min="0" step="1" placeholder="Цена, €" aria-label="Цена">
    <select class="inp" name="pr" aria-label="Приоритет" style="width:100%"><option value="1">Очень хочу</option><option value="2" selected>Хочу</option><option value="3">Когда-нибудь</option></select>
    <button class="btn acc wide">Добавить</button>
    <input class="inp wide" name="url" placeholder="Ссылка на товар (необязательно)" style="grid-column:1/-1">
  </form>
  <div class="hint">Откладывай деньги на хотелку и следи за прогрессом. «В цели» превращает её в цель на месяц или квартал. Правило 72 часов помогает не покупать на эмоциях.</div>
  <div class="wishgrid">${want.length ? want.map(card).join('') : `<div class="empty"><b>Список пуст</b>Запиши, чего хочется. Мотивация работает лучше, когда цель видна.</div>`}</div>
  ${got.length ? `<div class="sec">Исполнено · ${got.length}</div><div class="card" style="overflow-x:auto"><table><tbody>${got.slice(0, 20).map(w => `<tr><td class="num muted">${w.boughtAt ? dueLabel(dayOf(w.boughtAt)) : ''}</td><td>✦ ${esc(w.title)}</td><td class="r num">${w.price ? eur(w.price) : ''}</td><td class="r"><button class="btn sm ghost" data-a="wishback" data-id="${w.id}">Вернуть</button></td></tr>`).join('')}</tbody></table></div>` : ''}`;
}

/* ---------- Деньги ---------- */
function moneyHtml(){
  const s = stats(); const now = new Date(); const mk = pkey('month', now); const tgt = S.settings.moneyTarget;
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(); const dleft = dim - now.getDate() + 1;
  const pace = tgt > 0 ? Math.max(0, (tgt - s.monthMoney) / dleft) : 0;
  const pct = tgt > 0 ? Math.min(1, s.monthMoney / tgt) : 0; const tpct = now.getDate() / dim;
  const months = [...Array(6)].map((_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1); const k = pkey('month', d); return {d, k, v: S.money.filter(e => e.date.slice(0, 7) === k).reduce((a, e) => a + e.amount, 0)}; });
  const mx = Math.max(tgt, ...months.map(m => m.v), 1);
  const W = 700, H = 200, pl = 10, pb = 28, pt = 22, step = (W - pl * 2) / 6, bw = 64; const y = v => H - pb - (v / mx) * (H - pb - pt);
  const bars = months.map((m, i) => { const x = pl + step * i + (step - bw) / 2; const cur = m.k === mk;
    return `<rect x="${x}" y="${y(m.v)}" width="${bw}" height="${H - pb - y(m.v)}" rx="5" fill="var(--good)" fill-opacity="${cur ? 1 : .45}"/>${m.v ? `<text x="${x + bw / 2}" y="${y(m.v) - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${Math.round(m.v).toLocaleString('ru-RU')}</text>` : ''}<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${cur ? 'var(--text)' : 'var(--muted)'}" font-weight="${cur ? 700 : 400}">${MS[m.d.getMonth()]}</text>`; }).join('');
  const tline = tgt > 0 ? `<line x1="${pl}" x2="${W - pl}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--xp)" stroke-dasharray="5 5"/><text x="${W - pl}" y="${y(tgt) - 6}" text-anchor="end" font-size="11" fill="var(--xp)">цель ${Math.round(tgt).toLocaleString('ru-RU')}</text>` : '';
  const ents = S.money.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 40);
  const avg3 = months.slice(2, 5).reduce((a, m) => a + m.v, 0) / 3;
  const shM = shiftMinutes(dk(new Date(now.getFullYear(), now.getMonth(), 1)), dk(new Date(now.getFullYear(), now.getMonth() + 1, 0)));
  return `<h1 class="view">${M.money.h}</h1>
  <div class="hint" style="margin:0 0 14px">${IS_WORK ? 'Записывай каждое поступление: зарплату, бонусы, доход своего проекта. Видно, сколько осталось до цели и какой нужен темп.' : 'Записывай, сколько отложил. Пополнения хотелок попадают сюда автоматически.'} Каждая запись даёт 5 XP.</div>
  <div class="card">
    <div class="goalbig"><b class="num">${eur(s.monthMoney)}</b><span class="muted num">${tgt > 0 ? 'из ' + eur(tgt) + ' за ' + MN[now.getMonth()].toLowerCase() : 'за ' + MN[now.getMonth()].toLowerCase() + ' · цель не задана'}</span></div>
    ${tgt > 0 ? `<div class="bigbar"><i style="width:${pct * 100}%"></i></div><div class="timebar" style="margin:0"><span class="num">${Math.round(pct * 100)}% цели · прошло ${Math.round(tpct * 100)}% месяца</span><span style="flex:1"></span>${s.monthMoney >= tgt ? '<span style="color:var(--good);font-weight:700">Цель выполнена</span>' : `<span class="num" style="color:${pct + .05 < tpct ? 'var(--warn)' : 'var(--text)'}">Нужно ${eur(pace)} в день до конца месяца</span>`}</div>` : ''}
    <div class="btnrow" style="margin-top:14px">
      <form class="inline" data-f="target" style="margin:0"><label for="tgt" class="muted" style="font-size:13px">${M.money.target}, €</label><input class="inp" id="tgt" name="v" type="number" min="0" step="50" value="${tgt || ''}" style="flex:0 1 140px;min-width:110px" placeholder="3000"><button class="btn sm ghost">Сохранить</button></form>
      ${IS_WORK ? `<form class="inline" data-f="rate" style="margin:0"><label for="rate" class="muted" style="font-size:13px">Ставка в час, €</label><input class="inp" id="rate" name="v" type="number" min="0" step="0.5" value="${S.settings.rate || ''}" style="flex:0 1 100px;min-width:90px" placeholder="0"><button class="btn sm ghost">Сохранить</button></form>` : ''}
    </div>
    <div class="meta" style="margin-top:10px"><span>Среднее за 3 прошлых месяца: <b class="num" style="color:var(--text)">${eur(avg3)}</b></span>${IS_WORK && shM ? `<span>Смен в этом месяце: <b class="num" style="color:var(--text)">${Math.round(shM / 6) / 10} ч</b>${S.settings.rate > 0 ? ` ≈ <b class="num" style="color:var(--text)">${eur(shM / 60 * S.settings.rate)}</b> по ставке` : ''}</span>` : ''}</div>
  </div>
  <form class="addq" data-f="money" style="grid-template-columns:130px 1fr 160px auto">
    <input class="inp" name="a" type="number" min="0.01" step="0.01" placeholder="Сумма, €" aria-label="Сумма" required>
    <input type="text" class="inp" name="t" placeholder="${M.money.ph}" maxlength="80" autocomplete="off">
    <input class="inp" name="d" type="date" value="${todayK()}" aria-label="Дата">
    <button class="btn acc">+ ${M.money.entry}</button>
  </form>
  <div class="card chart"><h3>Последние 6 месяцев</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Суммы по месяцам">${tline}${bars}</svg></div>
  <div class="card" style="overflow-x:auto"><h3>Записи</h3>${ents.length ? `<table><thead><tr><th>Дата</th><th>Описание</th><th class="r">Сумма</th><th></th></tr></thead><tbody>${ents.map(e => { const d = parseDk(e.date); return `<tr><td class="num">${d.getDate()} ${MG[d.getMonth()]}</td><td>${esc(e.note) || '<span class="muted">без описания</span>'}</td><td class="r num" style="color:var(--good);font-weight:700">+${eur(e.amount)}</td><td class="r">${ui.del === e.id ? `<button class="ib danger" data-a="delmoney" data-id="${e.id}" style="display:inline-grid">Удалить?</button>` : `<button class="ib" data-a="delmoney" data-id="${e.id}" aria-label="Удалить" style="display:inline-grid">${IC.trash}</button>`}</td></tr>`; }).join('')}</tbody></table>` : '<div class="muted" style="font-size:14px">Пока нет записей</div>'}</div>`;
}

/* ---------- Отчёт ---------- */
function heatmap(){
  const weeks = 26; const end = wkStart(new Date()); const start = shiftD('week', end, -(weeks - 1));
  const byDay = {}; LOG.forEach(l => { const k = dayOf(l.t); byDay[k] = (byDay[k] || 0) + l.xp; });
  const mx = Math.max(60, ...Object.values(byDay));
  const cs = 14, gap = 3, pl = 24, ptop = 18; const W = pl + weeks * (cs + gap), H = ptop + 7 * (cs + gap);
  let cells = '', months = ''; let lastM = -1; const tk = todayK();
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++){
    const day = new Date(start); day.setDate(day.getDate() + w * 7 + d); const k = dk(day); if (k > tk) continue;
    const v = byDay[k] || 0; const fz = S.freezeUsed.some(f => f.day === k);
    cells += `<rect x="${pl + w * (cs + gap)}" y="${ptop + d * (cs + gap)}" width="${cs}" height="${cs}" rx="3" fill="${v ? 'var(--xp)' : fz ? 'var(--accent)' : 'var(--sunk)'}" fill-opacity="${v ? (.2 + .8 * Math.min(1, v / mx)).toFixed(2) : fz ? .5 : 1}"><title>${day.getDate()} ${MG[day.getMonth()]}: ${v} XP${fz ? ' (заморозка)' : ''}</title></rect>`;
    if (d === 0 && day.getMonth() !== lastM){ lastM = day.getMonth(); months += `<text x="${pl + w * (cs + gap)}" y="11" font-size="10" fill="var(--muted)">${MS[lastM]}</text>`; }
  }
  const labels = [0, 2, 4].map(i => `<text x="0" y="${ptop + i * (cs + gap) + 11}" font-size="10" fill="var(--muted)">${WS[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Активность за полгода">${months}${labels}${cells}</svg>`;
}
function reportHtml(){
  const s = stats(); const days = [...Array(7)].map((_, i) => shiftD('day', new Date(), i - 6));
  const data = days.map(d => { const k = dk(d); const ls = LOG.filter(l => dayOf(l.t) === k); return {d, task: ls.filter(isTaskLog).reduce((a, l) => a + l.xp, 0), other: ls.filter(l => !isTaskLog(l)).reduce((a, l) => a + l.xp, 0)}; });
  const nice = Math.ceil(Math.max(50, ...data.map(x => x.task + x.other)) / 50) * 50;
  const W = 700, H = 220, pl = 40, pb = 28, pt = 18, bw = 54; const step = (W - pl - 10) / 7; const y = v => H - pb - (v / nice) * (H - pb - pt);
  const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${W - 6}" y1="${y(nice * f)}" y2="${y(nice * f)}" stroke="var(--line)" stroke-dasharray="${f ? '3 4' : ''}"/><text x="${pl - 8}" y="${y(nice * f) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${nice * f}</text>`).join('');
  const bars = data.map((x, i) => { const cx = pl + step * i + (step - bw) / 2; const ya = y(x.task), yb = y(x.task + x.other); const tot = x.task + x.other; const isT = i === 6;
    return `${x.task ? `<rect x="${cx}" y="${ya}" width="${bw}" height="${H - pb - ya}" rx="4" fill="var(--accent)"/>` : ''}${x.other ? `<rect x="${cx}" y="${yb}" width="${bw}" height="${Math.max(1, ya - yb - (x.task ? 2 : 0))}" rx="4" fill="var(--xp)"/>` : ''}
      ${tot ? `<text x="${cx + bw / 2}" y="${yb - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${tot}</text>` : ''}
      <text x="${cx + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${isT ? 'var(--text)' : 'var(--muted)'}" font-weight="${isT ? 700 : 400}">${WS[dow(x.d)]} ${x.d.getDate()}</text>`; }).join('');
  const wk = Date.now() - 7 * 864e5; const weekLog = LOG.filter(l => l.t >= wk);
  const weekTasks = weekLog.filter(isTaskLog).length;
  const weekFocus = weekLog.filter(l => String(l.id).startsWith('f:')).reduce((a, l) => a + (l.f || 0), 0);
  const en = Object.entries(S.reviews).filter(([d, r]) => parseDk(d).getTime() >= wk - 864e5 && r.energy).map(([, r]) => r.energy);
  const enAvg = en.length ? (en.reduce((a, b) => a + b, 0) / en.length).toFixed(1) : '—';
  const wS = dk(wkStart(new Date())); const wE = addDays(wS, 6);
  const shW = shiftMinutes(wS, wE); let meets = 0; for (let k = wS; k <= wE; k = addDays(k, 1)) meets += eventsOn(k).filter(e => e.type === 'meet' || e.type === 'call').length;
  const rows = S.spaces.map(sp => { const xp = LOG.filter(l => l.sp === sp.id).reduce((a, l) => a + l.xp, 0); const wxp = weekLog.filter(l => l.sp === sp.id).reduce((a, l) => a + l.xp, 0); const open = S.tasks.filter(t => t.spaceId === sp.id && !t.done && !kids(t.id).length).length; const li = lvlInfo(xp);
    return `<tr><td><span class="tag" style="--c:${sp.color}"><i></i>${esc(sp.name)}</span></td><td style="min-width:120px"><div style="display:flex;gap:8px;align-items:center"><b class="num">${li.lvl}</b><div class="mini" style="flex:1;margin:0"><i style="width:${li.pct * 100}%;background:${sp.color}"></i></div></div></td><td class="r num">+${wxp}</td><td class="r num">${open}</td></tr>`; }).join('');
  const hz = HS.map(h => { const k = pkey(h, new Date()); const rs = S.tasks.filter(t => !t.parentId && t.horizon === h && t.period === k); const p = rs.length ? rs.reduce((a, t) => a + progress(t), 0) / rs.length : 0; const el = elapsed(h, new Date()); const behind = rs.length && p + .05 < el && h !== 'day';
    return `<div class="hzrow"><b>${HN[h]}</b><div class="mini"><i style="width:${p * 100}%;background:${behind ? 'var(--warn)' : 'var(--good)'}"></i></div><span class="num" style="text-align:right">${rs.length ? Math.round(p * 100) + '%' : '—'}</span></div>`; }).join('');
  const wkKey = pkey('week', new Date()); const wr = S.weekReviews[wkKey] || {};
  return `<h1 class="view">Отчёт</h1>
  <div class="tiles">
    <div class="tile"><small>XP за 7 дней</small><b class="num">${s.weekXp}</b></div>
    <div class="tile"><small>Задач закрыто</small><b class="num">${weekTasks}</b></div>
    <div class="tile"><small>Фокус за неделю</small><b class="num">${Math.floor(weekFocus / 60)} ч ${weekFocus % 60} м</b></div>
    <div class="tile"><small>Средняя энергия</small><b class="num">${enAvg}${en.length ? ' / 5' : ''}</b></div>
    <div class="tile"><small>Смены на этой неделе</small><b class="num">${Math.round(shW / 6) / 10} ч</b></div>
    <div class="tile"><small>Встречи и созвоны</small><b class="num">${meets}</b></div>
    <div class="tile"><small>Серия</small><b class="num">${s.streak} ${plural(s.streak,'день','дня','дней')}</b></div>
    <div class="tile"><small>Всего фокуса</small><b class="num">${Math.round(s.focusMin / 6) / 10} ч</b></div>
  </div>
  <div class="card chart"><h3>Опыт по дням</h3><div class="legend"><span><i style="background:var(--accent)"></i>Задачи</span><span><i style="background:var(--xp)"></i>Привычки, фокус, квесты дня</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Опыт за последние 7 дней">${grid}${bars}</svg></div>
  <div class="sides" style="margin:0 0 12px">${S.spaces.map(sp => { const info = lvlInfo(LOG.filter(l => l.sp === sp.id).reduce((a, l) => a + l.xp, 0)); return `<div class="sidecard"><div class="ic" style="background:${sp.color}">${info.lvl}</div><div class="grow"><div class="top"><div>${esc(sp.name)}</div><span class="num">${info.cur}/${info.need}</span></div><div class="mini"><i style="width:${info.pct * 100}%;background:${sp.color}"></i></div></div></div>`; }).join('')}</div>
  <div class="card heat"><h3>Активность за полгода</h3>${heatmap()}</div>
  <div class="card"><h3>Прогресс целей текущих периодов <small>оранжевый значит отставание от графика</small></h3>${hz}</div>
  <form class="card" data-f="wreview" data-wk="${wkKey}" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Итоги недели <small>${plabel('week', new Date())} · ${S.weekReviews[wkKey] ? 'сохранено' : '+25 XP'}</small></h3>
    <label class="f">Главная победа недели<textarea class="inp" name="a" style="min-height:54px">${esc(wr.a || '')}</textarea></label>
    <label class="f">Что не получилось и почему<textarea class="inp" name="b" style="min-height:54px">${esc(wr.b || '')}</textarea></label>
    <label class="f">Три главных дела на следующую неделю<textarea class="inp" name="c" style="min-height:54px">${esc(wr.c || '')}</textarea></label>

  <div class="card" style="overflow-x:auto"><h3>Сферы</h3><table><thead><tr><th>Сфера</th><th>Уровень</th><th class="r">XP за неделю</th><th class="r">Открытых шагов</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
